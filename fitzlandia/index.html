<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitzLandia">
<title>FitzLandia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="topbar">
    <div class="logo">🎡 FitzLandia</div>
    <div class="stat" id="stMoney">💰 $600</div>
    <div class="stat" id="stStars">⭐ 0</div>
    <div class="stat" id="stGuests">🧑 0</div>
    <div class="spacer"></div>
    <button class="tb" id="btnChallenges" title="Challenges">🏆</button>
    <button class="tb" id="btnMenu" title="Menu">☰</button>
  </div>
  <div id="hint" hidden></div>
  <div id="toast"></div>
  <div id="camBtns">
    <button id="camIn" title="Zoom in">➕</button>
    <button id="camOut" title="Zoom out">➖</button>
    <button id="camFind" title="Find my ride">📍</button>
    <button id="camRide" title="Ride cam">🎥</button>
  </div>
  <div id="flash"></div>
  <div id="joy" hidden><div id="joyKnob"></div></div>
  <div id="bottom">
    <div id="context"></div>
    <div id="tabs">
      <button data-mode="coaster">🎢<span>Coaster</span></button>
      <button data-mode="water">🌊<span>Water Ride</span></button>
      <button data-mode="shops">🏪<span>Shops</span></button>
      <button data-mode="walk">🚶<span>Walk</span></button>
      <button data-mode="view">👀<span>Watch</span></button>
    </div>
  </div>
  <div id="modal" hidden><div id="modalBox"></div></div>
</div>
<script src="vendor/three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"><\/script>')}</script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/track.js"></script>
<script src="js/buildings.js"></script>
<script src="js/guests.js"></script>
<script src="js/walk.js"></script>
<script src="js/spooky.js"></script>
<script src="js/game.js"></script>
</body>
</html>
